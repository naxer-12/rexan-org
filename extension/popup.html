<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rexan Curator</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --bg2: #222222;
      --bg3: #333333;
      --text: #f1f1f1;
      --muted: #aaaaaa;
      --accent: #ff6600;
      --good: #3ea6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--bg3);
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.5px;
    }
    .brand span b { color: var(--accent); }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
    }
    .status-dot.online { background: #22c55e; }
    .status-dot.offline { background: #ef4444; }

    .card {
      background: var(--bg2);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .field {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    input[type="text"], input[type="url"], select {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--bg3);
      border-radius: 6px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--good); }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }

    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      width: 100%;
      height: 40px;
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-subtle {
      background: var(--bg3);
      color: var(--text);
    }

    .preview {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      align-items: center;
    }
    .preview img {
      width: 100px;
      aspect-ratio: 16/9;
      border-radius: 6px;
      object-fit: cover;
      background: #000;
      flex: none;
    }
    .preview-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .preview-title {
      font-weight: 600;
      font-size: 13px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .preview-channel {
      font-size: 11px;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 2px;
    }
    .badge.hn { background: rgba(255,102,0,.2); color: #ff6600; }
    .badge.yt { background: rgba(230,33,23,.2); color: #e62117; }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: var(--bg);
      padding: 6px 8px;
      border: 1px solid var(--bg3);
      border-radius: 6px;
      min-height: 34px;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg2);
      border: 1px solid var(--bg3);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
    }
    .tag-del {
      cursor: pointer;
      opacity: 0.7;
      font-weight: bold;
    }
    .tag-del:hover { opacity: 1; color: var(--accent); }
    .tag-add-input {
      border: none !important;
      background: transparent !important;
      height: 22px !important;
      padding: 0 4px !important;
      flex: 1;
      min-width: 80px;
      font-size: 11px !important;
    }

    .success-box {
      text-align: center;
      padding: 16px 8px;
    }
    .success-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .server-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--bg3);
    }
    .server-footer a { color: var(--good); text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icon16.png" alt="R" style="width:16px;height:16px;">
      <span>Rexan<b>.org</b> Curator</span>
    </div>
    <div id="status-indicator" class="status-dot" title="Checking server..."></div>
  </div>

  <div id="loader" style="text-align:center; padding: 20px 0; color:var(--muted); display:none;">
    Fetching video details...
  </div>

  <div id="not-connected" class="card" style="display:none; text-align:center;">
    <p style="margin-bottom:8px; font-weight:600; color:#ef4444;">Cannot connect to Rexan server</p>
    <p style="color:var(--muted); font-size:12px; margin-bottom:12px;">Make sure your server is running at <code>http://localhost:8000</code>.</p>
    <button class="btn btn-subtle" id="retry-conn-btn">Retry Connection</button>
  </div>

  <!-- Manual link input if not on a youtube tab -->
  <div id="url-box" class="field" style="display:none;">
    <label for="manual-url">YouTube Video URL</label>
    <div class="row">
      <input type="url" id="manual-url" placeholder="https://youtube.com/watch?v=...">
      <button class="btn btn-subtle" id="manual-fetch-btn">Fetch</button>
    </div>
  </div>

  <!-- Main submission card -->
  <div id="video-card" class="card" style="display:none;">
    <div class="preview">
      <img id="v-thumb" src="" alt="">
      <div class="preview-info">
        <div class="preview-title" id="v-title"></div>
        <div class="preview-channel" id="v-channel"></div>
        <div id="v-badge"></div>
      </div>
    </div>

    <div class="field">
      <label for="v-playlist">Add to Playlist</label>
      <select id="v-playlist">
        <option value="">-- None (Video Catalog only) --</option>
      </select>
    </div>

    <div class="field">
      <label>Tags (Pre-assigned & Editable)</label>
      <div class="tag-container" id="v-tags">
        <input class="tag-add-input" id="new-tag-input" placeholder="+ tag...">
      </div>
    </div>

    <button class="btn btn-primary" id="add-btn">
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Add to Rexan (1-Click)
    </button>
  </div>

  <!-- Success confirmation state -->
  <div id="success-card" class="card success-box" style="display:none;">
    <div class="success-icon">✓</div>
    <div style="font-weight:600; font-size:14px; margin-bottom:4px;" id="success-title">Video Added!</div>
    <div style="color:var(--muted); font-size:12px; margin-bottom:14px;" id="success-sub"></div>
    <div class="row" style="justify-content:center; gap:8px;">
      <button class="btn btn-primary" id="open-video-btn" style="width:auto;">Open in Rexan</button>
      <button class="btn btn-subtle" id="add-another-btn">Add Another</button>
    </div>
  </div>

  <div class="server-footer">
    <span id="server-label">Server: localhost:8000</span>
    <a href="#" id="toggle-settings">Settings</a>
  </div>

  <div id="settings-panel" style="display:none; margin-top:8px;" class="card">
    <div class="field">
      <label for="server-url">Rexan Server URL</label>
      <input type="text" id="server-url" value="http://localhost:8000">
    </div>
    <button class="btn btn-subtle" id="save-settings-btn" style="width:100%;">Save & Reconnect</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
